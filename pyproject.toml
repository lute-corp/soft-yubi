[project]
name = "soft-yubi"
version = "0.1.0"
description = "Convert a directory of raw yubi MCAPs into one quality-filtered LeRobot v3 dataset"
requires-python = ">=3.12,<3.14"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "lerobot==0.5.1",
    "mcap==1.3.1",
    "mcap-ros2-support==0.5.7",
    "numpy==2.2.6",
    "pillow==12.0.0",
    "pyarrow",
    "scipy==1.17.1",
    "tqdm",
]

[project.scripts]
run_pipeline = "soft_yubi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soft_yubi"]
